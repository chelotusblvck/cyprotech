name: Imagen tienda

# Las NEXT_PUBLIC_* se incrustan al compilar, por eso se pasan aquí como build args (variables del repositorio).
on:
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".npmrc"
      - ".github/workflows/build-storefront.yml"
  workflow_dispatch:

concurrency:
  group: build-storefront
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_UUID: ${{ vars.COOLIFY_STOREFRONT_UUID }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ vars.NEXT_PUBLIC_DEFAULT_REGION || 'cl' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cyprotech-storefront:latest
            ghcr.io/${{ github.repository_owner }}/cyprotech-storefront:${{ github.sha }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,scope=storefront,mode=max
      - name: Desplegar en Coolify
        if: ${{ env.COOLIFY_TOKEN != '' && env.COOLIFY_UUID != '' && env.COOLIFY_URL != '' }}
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_UUID&force=false"
